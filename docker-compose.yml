# ============================================================================
# Voyage 一键部署
#
#   docker compose up -d --build
#
# 三个服务：
#   redis    —— 限流、验证码、Refresh Token、Token 用量统计（必须 Redis >= 7）
#   backend  —— FastAPI 后端，容器启动时自动执行 alembic upgrade head
#   web      —— nginx 托管前端静态资源，并把 /api 反代到 backend
#
# 只需对外暴露 web 的 80 端口；后端与 Redis 只在内部网络可达。
# ============================================================================

services:
  # ---------------------------------------------------------------- Redis
  redis:
    # 必须是 7.x：限流原语依赖 EXPIRE 的 NX 选项（5.x/6.x 不支持）。
    # 早前用本地 Redis 5.0 时登录接口会直接 500，这里改用 Lua 脚本兼容，
    # 但部署环境仍建议 7.x 以获得完整语义。
    image: redis:7-alpine
    container_name: voyage-redis
    restart: unless-stopped
    # 数据落到命名卷：容器重建后验证码/限流计数/令牌不丢
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [voyage]

  # -------------------------------------------------------------- Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: voyage-backend:latest
    container_name: voyage-backend
    restart: unless-stopped
    # 读取与本机开发相同的 .env（密钥、模型通道、邮箱等都在里面）。
    # 该文件已被 .gitignore 忽略，不会进版本库。
    env_file:
      - .env
    environment:
      # ⚠ 必须覆盖：.env 里的 REDIS_URL 指向本机或云 Redis，
      # 容器内应使用 compose 网络里的服务名。
      REDIS_URL: redis://redis:6379/7
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "7"
      # 分享链接的对外基址：改成你的服务器地址或域名，
      # 否则「分享链接」复制出来仍是 localhost，别人打不开。
      SHARE_BASE_URL: ${SHARE_BASE_URL:-http://localhost}
      # 日志输出到文件（挂载在 data 卷里，便于排查线上问题）
      LOG_TO_FILE: "true"
      # 数据库：默认沿用 .env 里的 DATABASE_URL（通常指向外部 PostgreSQL，
      # 如 Neon / 自建实例）。若启用了下方可选的 postgres 服务，
      # 把这一项改成容器内的地址即可：
      #   DATABASE_URL: postgresql+asyncpg://voyage:voyage@postgres:5432/voyage
      #
      # 注意：**不配 DATABASE_URL 时后端会回退到容器内的 SQLite**
      # （/app/data/app.db），单机演示够用，但不适合多人使用。
    volumes:
      # 这里挂载 data 目录有两个作用：
      #   1. 日志文件（LOG_TO_FILE=true 时写在这里）
      #   2. 未配置 DATABASE_URL 时，SQLite 回退库也在这里
      # 配了 PostgreSQL 时，业务数据不在容器内，本卷只承载日志。
      - ./data:/app/data
    # 与 Dockerfile 里的 HEALTHCHECK 一致，此处显式声明便于阅读与调整。
    # depends_on 的 service_healthy 条件正是靠它生效。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/docs"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks: [voyage]

  # ------------------------------------------------------- PostgreSQL（可选）
  # 默认**不启动**：只在你没有外部 PostgreSQL 时才需要它。
  #
  # 启用方式：
  #   1. docker compose --profile with-db up -d
  #   2. 把上面 backend 的 DATABASE_URL 指向它：
  #        DATABASE_URL: postgresql+asyncpg://voyage:voyage@postgres:5432/voyage
  #      （注意用服务名 postgres 而不是 localhost——容器之间走 compose 网络）
  #
  # 用 profile 而不是直接放开的原因：多数部署连的是外部托管 PG
  # （如 Neon），若无条件拉起一个本地 PG，会同时存在两个数据库，
  # 容易出现「数据写进了哪个库」的混乱。
  postgres:
    image: postgres:16-alpine
    container_name: voyage-postgres
    restart: unless-stopped
    profiles: ["with-db"]
    environment:
      POSTGRES_USER: voyage
      POSTGRES_PASSWORD: voyage
      POSTGRES_DB: voyage
      # 中文内容不受影响（库默认 UTF8），这里只固定排序规则便于索引行为可预期
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyage -d voyage"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [voyage]

  # ------------------------------------------------------------------ Web
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: voyage-web:latest
    container_name: voyage-web
    restart: unless-stopped
    ports:
      # 只暴露这一个端口。换端口改左侧即可，例如 "8080:80"；
      # 也可以用环境变量覆盖：WEB_PORT=8080 docker compose up -d
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      # 等后端通过健康检查再启动，避免首屏请求打到还没就绪的接口
      backend:
        condition: service_healthy
    networks: [voyage]

volumes:
  redis-data:
    driver: local
  # postgres 服务的持久化卷（仅在启用 with-db profile 时使用）
  pg-data:
    driver: local

networks:
  voyage:
    driver: bridge
