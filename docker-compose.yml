# ============================================================================
# Voyage 一键部署
#
#   docker compose up -d --build
#
# 三个服务：
#   redis    —— 限流、验证码、Refresh Token、Token 用量统计（必须 Redis >= 7）
#   backend  —— FastAPI 后端，容器启动时自动执行 alembic upgrade head
#   web      —— nginx 托管前端静态资源，并把 /api 反代到 backend
#
# 只需对外暴露 web 的 80 端口；后端与 Redis 只在内部网络可达。
# ============================================================================

services:
  # ---------------------------------------------------------------- Redis
  redis:
    # 必须是 7.x：限流原语依赖 EXPIRE 的 NX 选项（5.x/6.x 不支持）。
    # 早前用本地 Redis 5.0 时登录接口会直接 500，这里改用 Lua 脚本兼容，
    # 但部署环境仍建议 7.x 以获得完整语义。
    image: redis:7-alpine
    container_name: voyage-redis
    restart: unless-stopped
    # 数据落到命名卷：容器重建后验证码/限流计数/令牌不丢
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [voyage]

  # -------------------------------------------------------------- Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: voyage-backend:latest
    container_name: voyage-backend
    restart: unless-stopped
    # 读取与本机开发相同的 .env（密钥、模型通道、邮箱等都在里面）。
    # 该文件已被 .gitignore 忽略，不会进版本库。
    env_file:
      - .env
    environment:
      # ⚠ 必须覆盖：.env 里的 REDIS_URL 指向本机或云 Redis，
      # 容器内应使用 compose 网络里的服务名。
      REDIS_URL: redis://redis:6379/7
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "7"
      # 数据库指向 compose 内的 postgres 服务。
      #
      # 为什么在这里写死而不是沿用 .env：.env 里的 DATABASE_URL 是**本机开发**
      # 用的（可能指向 Neon 等外部实例）。若原样带进容器，就会出现
      # 「起了一个没人用的 PG，而后端连去外部库」——数据到底写进哪里都说不清。
      # 这里显式覆盖，保证容器部署的数据落在 compose 内的 PG 里。
      #
      # 若确实想用外部 PostgreSQL，把下面这行注释掉，并在 .env 里配 DATABASE_URL。
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voyage}:${POSTGRES_PASSWORD:-voyage}@postgres:5432/${POSTGRES_DB:-voyage}
      # 分享链接的对外基址：改成你的服务器地址或域名，
      # 否则「分享链接」复制出来仍是 localhost，别人打不开。
      SHARE_BASE_URL: ${SHARE_BASE_URL:-http://localhost}
      # 日志输出到文件（挂载在 data 卷里，便于排查线上问题）
      LOG_TO_FILE: "true"
    volumes:
      # 挂载 data 目录用于持久化日志文件。
      # 业务数据在 postgres 容器里（独立的 pg-data 卷），不在这个目录下。
      - ./data:/app/data
    # 与 Dockerfile 里的 HEALTHCHECK 一致，此处显式声明便于阅读与调整。
    # depends_on 的 service_healthy 条件正是靠它生效。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/docs"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      # 等 PG 真正可接受连接再启动，避免迁移在数据库还没就绪时失败。
      # 用 service_healthy 而不是 service_started：后者只保证容器起来了，
      # 而 postgres 初始化需要几秒，此时连接会被拒。
      postgres:
        condition: service_healthy
    networks: [voyage]

  # ------------------------------------------------------- PostgreSQL
  # 默认随 `docker compose up -d` 一起启动。
  #
  # 第一版曾用 profiles 把它设为「可选、默认不启动」，理由是「多数部署连外部托管 PG」。
  # 但实际部署时发现那个默认值会坑人：起了一个没人用的 PG，而后端仍连 .env 里的
  # 外部库，数据到底写进哪里都说不清。现在改为**默认启动且后端自动连它**，
  # 拿到项目 `docker compose up -d --build` 一条命令即可用，无需改任何配置。
  #
  # 若确实要用外部 PostgreSQL：注释掉上面 backend 的 DATABASE_URL 覆盖，
  # 并在 .env 里配置 DATABASE_URL 即可。此时本服务可以 `docker compose stop postgres`。
  postgres:
    image: postgres:16-alpine
    container_name: voyage-postgres
    restart: unless-stopped
    environment:
      # 账号密码可用环境变量覆盖；默认值仅适用于内网 compose 部署，
      # 不对宿主机暴露端口，故不强制设置。生产环境建议在 .env 里覆盖。
      POSTGRES_USER: ${POSTGRES_USER:-voyage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyage}
      POSTGRES_DB: ${POSTGRES_DB:-voyage}
      # 中文内容不受影响（库默认 UTF8），这里只固定初始化参数便于行为可预期
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voyage} -d ${POSTGRES_DB:-voyage}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [voyage]

  # ------------------------------------------------------------------ Web
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: voyage-web:latest
    container_name: voyage-web
    restart: unless-stopped
    ports:
      # 只暴露这一个端口。换端口改左侧即可，例如 "8080:80"；
      # 也可以用环境变量覆盖：WEB_PORT=8080 docker compose up -d
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      # 等后端通过健康检查再启动，避免首屏请求打到还没就绪的接口
      backend:
        condition: service_healthy
    networks: [voyage]

volumes:
  redis-data:
    driver: local
  # PostgreSQL 的数据卷。**必须持久化**：容器重建时业务数据（用户、会话、行程、
  # 对话状态）都在这里，删掉即全部丢失。
  pg-data:
    driver: local

networks:
  voyage:
    driver: bridge
