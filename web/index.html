<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- 站点图标：
         voyage-favicon.png（32x32）用于浏览器标签页，尺寸与标签页需求一致，
         其字标在该尺寸下已不可辨，只作缩略标记使用；
         apple-touch-icon 用 voyage-icon-1.png（128x128，现有最大规格），
         系统会自行缩放，往主屏图标需要更清晰时再补 180x180 版本。
         注意 favicon 必须是 PNG/SVG/ICO——浏览器不支持 JPEG 图标。 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/voyage-favicon.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="/voyage-icon-1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Voyage AI — 智能旅行规划平台：多 Agent 协作、实时天气与车次查询、结构化行程生成与编辑。" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <title>Voyage AI · 智能旅行规划</title>

    <!-- Sora：只取西文与数字（约 30KB），让标题与数据带几何感；
         中文继续走系统字体，不为此付几 MB 的下载代价。
         preconnect 提前建连，避免字体请求拖慢首屏文字渲染。
         若部署环境无法访问外网，删掉这三行即可——字体栈有完整回落。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // 首屏前确定主题，避免浅色/深色闪烁
      ;(function () {
        try {
          var stored = localStorage.getItem('voyage-theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
