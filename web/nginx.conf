# ============================================================================
# Voyage 前端站点配置
#
# 职责：
#   1. 托管 Vue 构建产物，并为 history 模式的路由做 SPA 回退
#      （/admin、/share/xxx 这类深层路径刷新时会直接请求服务器，
#        找不到文件必须回退到 index.html，否则 404）
#   2. 把 /api 反代到后端容器，实现同源部署
#   3. 把 SSE 流式响应配置成不缓冲，否则 AI 回复会「攒一批才吐出来」
# ============================================================================

upstream voyage_backend {
    # backend 是 docker-compose 里的服务名，由内嵌 DNS 解析
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 请求体上限：目前接口只收文本，留着余量即可
    client_max_body_size 8m;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/xml image/svg+xml;

    # ---------- 存活探针 ----------
    # 精确匹配 = ：/health 是基础设施接口，不能落进下方 SPA 回退
    # （否则返回的是 index.html，监控永远看到「健康」）。
    # 反代到后端，让外部监控拿到的是后端真实状态。
    location = /health {
        proxy_pass http://voyage_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://voyage_backend;
        proxy_http_version 1.1;

        # 透传真实来源信息，后端用 --proxy-headers 读取
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 流式对话的关键配置 ----
        # 关闭缓冲，否则 nginx 会攒够一块才转发，前端看到的就不是逐字输出
        proxy_buffering off;
        proxy_cache off;
        # 关闭响应压缩：压缩需要缓冲，会抵消上面的流式效果
        gzip off;
        # 长连接：AI 生成可能持续较久，默认 60s 容易在长回复时被切断
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # 告知可能的上游代理不要缓冲（Cloudflare 等会识别此头）
        add_header X-Accel-Buffering no;
    }

    # ---------- 带内容哈希的静态资源：长期缓存 ----------
    # Vite 产物文件名含哈希，内容变了文件名就变，可以放心长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA 回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 一律不缓存，保证发版后用户立刻拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
