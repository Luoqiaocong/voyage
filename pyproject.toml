[project]
name = "voyage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi-utils>=0.8.0",
    "sse-starlette>=2.2.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.3",
    "llama-index>=0.14.23",
    "llama-index-llms-openai>=0.7.10",
    "llama-index-vector-stores-milvus>=1.1.0",
    "pydantic-settings>=2.15.0",
    "pymilvus>=2.6.17",
    "python-dotenv>=1.2.2",
    "redis>=5.2.1,<8.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.1",
    "langgraph-checkpoint-redis>=0.5.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "aiosqlite>=0.22.1",
    "langchain-mcp-adapters>=0.3.2",
    "argon2-cffi>=25.1.0",
    "python-jose>=3.5.0",
    "hashids>=1.3.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv.workspace]
members = [
    "voyage",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]
